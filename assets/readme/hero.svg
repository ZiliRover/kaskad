<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Kaskad</title>
  <desc id="desc">Kaskad, a node studio for AI video and images. A prompt node cascades into an image model and then into a video model, each wire colored by the data it carries.</desc>

  <defs>
    <!-- the studio's canvas grid -->
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.3" fill="#25272e"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="400" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#0e0f12"/>
    <rect x="600" width="600" height="400" fill="url(#dots)"/>
  </g>

  <g id="title-block" transform="translate(64 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#9ba0ab">NODE STUDIO FOR AI VIDEO AND IMAGES</text>

    <g transform="translate(0 124)">
      <rect width="52" height="52" rx="16" fill="#d7f75b"/>
      <rect x="15" y="15" width="22" height="22" rx="7" fill="#0e0f12"/>
    </g>
    <text x="72" y="172" font-size="72" font-weight="700" letter-spacing="-1.5" fill="#e7e9ee">Kaskad</text>

    <text x="0" y="238" font-size="26" fill="#c9ccd3">Chain prompts, images and 80+ AI models</text>
    <text x="0" y="274" font-size="26" fill="#c9ccd3">into video pipelines on one canvas.</text>

    <text x="0" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8b909b">28 video · 53 image · 3 text models · via OpenRouter</text>
  </g>

  <!-- the cascade: real node types from the studio, wires colored by data type -->
  <g id="cascade" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <path d="M828 118 H 872" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-opacity=".8"/>
    <path d="M1102 118 H 1122 Q 1142 118 1142 138 V 176 Q 1142 196 1122 196 H 772 Q 752 196 752 216 V 254 Q 752 274 772 274 H 792"
          fill="none" stroke="#fbbf24" stroke-width="3" stroke-opacity=".8"/>

    <g transform="translate(628 80)">
      <rect width="200" height="76" rx="12" fill="#15161a" stroke="#343640" stroke-width="1.5"/>
      <text x="20" y="34" font-size="22" font-weight="600" fill="#e7e9ee">Prompt</text>
      <text x="20" y="60" font-size="18" fill="#9ba0ab">an idea in words</text>
      <circle cx="200" cy="38" r="7" fill="#7dd3fc"/>
    </g>

    <g transform="translate(872 80)">
      <rect width="230" height="76" rx="12" fill="#15161a" stroke="#343640" stroke-width="1.5"/>
      <text x="20" y="34" font-size="22" font-weight="600" fill="#e7e9ee">Nano Banana 2</text>
      <text x="20" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#9ba0ab">image · ≈ 6 ₽</text>
      <circle cx="0" cy="38" r="7" fill="#7dd3fc"/>
      <circle cx="230" cy="38" r="7" fill="#fbbf24"/>
    </g>

    <g transform="translate(792 236)">
      <rect width="230" height="76" rx="12" fill="#15161a" stroke="#d7f75b" stroke-width="1.5"/>
      <text x="20" y="34" font-size="22" font-weight="600" fill="#e7e9ee">Seedance 2.0</text>
      <text x="20" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#9ba0ab">video · ≈ 38 ₽</text>
      <circle cx="0" cy="38" r="7" fill="#fbbf24"/>
      <circle cx="230" cy="38" r="7" fill="#15161a" stroke="#fb7185" stroke-width="3"/>
    </g>
  </g>
</svg>
