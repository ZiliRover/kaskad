<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">How Kaskad runs a pipeline</title>
  <desc id="desc">The browser canvas sends the graph to the Next.js API, which plans the run and writes jobs to a Postgres queue. A separate worker takes jobs in dependency order, calls OpenRouter for AI models or ffmpeg for local tools, and stores results in file storage.</desc>

  <rect width="1200" height="460" rx="24" fill="#0e0f12"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <!-- wires first, cards on top -->
    <g fill="none" stroke="#5a606c" stroke-width="3">
      <path d="M288 150 H 336 M576 150 H 624 M864 150 H 912"/>
      <!-- the worker fans out: models, local tools, and file storage -->
      <path d="M1032 206 V 318"/>
      <path d="M1032 262 H 476 Q 456 262 456 282 V 318"/>
      <path d="M744 262 V 318"/>
    </g>

    <g transform="translate(48 94)">
      <rect width="240" height="112" rx="14" fill="#15161a" stroke="#343640" stroke-width="1.5"/>
      <text x="22" y="44" font-size="24" font-weight="600" fill="#e7e9ee">Canvas</text>
      <text x="22" y="76" font-size="18" fill="#9ba0ab">React Flow in the</text>
      <text x="22" y="98" font-size="18" fill="#9ba0ab">browser, autosaved</text>
    </g>

    <g transform="translate(336 94)">
      <rect width="240" height="112" rx="14" fill="#15161a" stroke="#343640" stroke-width="1.5"/>
      <text x="22" y="44" font-size="24" font-weight="600" fill="#e7e9ee">Next.js API</text>
      <text x="22" y="76" font-size="18" fill="#9ba0ab">plans the run, prices</text>
      <text x="22" y="98" font-size="18" fill="#9ba0ab">it, validates inputs</text>
    </g>

    <g transform="translate(624 94)">
      <rect width="240" height="112" rx="14" fill="#15161a" stroke="#343640" stroke-width="1.5"/>
      <text x="22" y="44" font-size="24" font-weight="600" fill="#e7e9ee">Postgres queue</text>
      <text x="22" y="76" font-size="18" fill="#9ba0ab">jobs with dependencies,</text>
      <text x="22" y="98" font-size="18" fill="#9ba0ab">results as history</text>
    </g>

    <g transform="translate(912 94)">
      <rect width="240" height="112" rx="14" fill="#15161a" stroke="#d7f75b" stroke-width="1.5"/>
      <text x="22" y="44" font-size="24" font-weight="600" fill="#e7e9ee">Worker</text>
      <text x="22" y="76" font-size="18" fill="#9ba0ab">separate process,</text>
      <text x="22" y="98" font-size="18" fill="#9ba0ab">resumes after restarts</text>
    </g>

    <g transform="translate(624 318)">
      <rect width="240" height="92" rx="14" fill="#15161a" stroke="#343640" stroke-width="1.5"/>
      <text x="22" y="40" font-size="24" font-weight="600" fill="#e7e9ee">OpenRouter</text>
      <text x="22" y="70" font-size="18" fill="#9ba0ab">video, image, text</text>
    </g>

    <g transform="translate(912 318)">
      <rect width="240" height="92" rx="14" fill="#15161a" stroke="#343640" stroke-width="1.5"/>
      <text x="22" y="40" font-size="24" font-weight="600" fill="#e7e9ee">ffmpeg</text>
      <text x="22" y="70" font-size="18" fill="#9ba0ab">last frame, join clips</text>
    </g>

    <g transform="translate(336 318)">
      <rect width="240" height="92" rx="14" fill="#15161a" stroke="#343640" stroke-width="1.5"/>
      <text x="22" y="40" font-size="24" font-weight="600" fill="#e7e9ee">File storage</text>
      <text x="22" y="70" font-size="18" fill="#9ba0ab">uploads and results</text>
    </g>

  </g>
</svg>
