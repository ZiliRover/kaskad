# electron-builder settings for the Windows installer (see scripts/build-desktop.mjs)
appId: ru.kaskad.desktop
productName: Kaskad
copyright: Kaskad
directories:
  app: build/desktop/app
  output: build/desktop/dist
  buildResources: desktop
extraResources:
  - from: build/desktop/stage
    to: .
    filter: ["**/*"]
asar: true
win:
  target: nsis
  icon: desktop/icon.ico
  artifactName: Kaskad-Setup-${version}.${ext}
  # not code-signed yet: Windows SmartScreen asks "Run anyway" on first install
  signAndEditExecutable: true
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Каскад
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerIcon: desktop/icon.ico
  uninstallerIcon: desktop/icon.ico
  uninstallDisplayName: Каскад
